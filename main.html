<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For my Love Love Angel Ann Obciana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Quicksand:wght@500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-key="">

  <!-- slow-moving glow backdrop, drawn continuously in background.js -->
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- interactive blooming flowers, drawn in flowers.js -->
  <canvas id="flowersCanvas" class="flowers-canvas" aria-hidden="true"></canvas>

  <!-- floating hearts live here, shared across every page -->
  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <!-- ================= MAIN SCREEN ================= -->
  <section class="screen main-screen is-visible" id="mainScreen">

    <nav class="site-nav" id="siteHeader" aria-label="Message buttons">
      <!-- filled in by header.js at load time -->
    </nav>

    <main class="stage" id="stage">
      <div class="envelope-wrap" id="envelopeWrap">
        <p class="unlocked-title">You unlocked my heart ♥</p>

        <!-- click to open: flap lifts, then the letter overlay shows the paper -->
        <button type="button" class="envelope-button" id="envelopeButton" aria-haspopup="dialog">
          <span class="envelope-back" aria-hidden="true"></span>
          <span class="envelope-pocket" aria-hidden="true"></span>
          <span class="envelope-flap" aria-hidden="true"></span>
          <span class="envelope-heart" aria-hidden="true">♥</span>
        </button>

        <p class="unlocked-hint">tap the envelope to open my letter</p>
      </div>

      <!-- spins while playing; click toggles play/pause -->
      <div class="disc-wrap" id="discWrap">
        <button type="button" class="music-disc" id="musicDiscButton" aria-pressed="false" aria-label="Play our song">
          <span class="disc-grooves" aria-hidden="true"></span>
          <span class="disc-label" aria-hidden="true">♪</span>
          <span class="disc-hole" aria-hidden="true"></span>
        </button>
        <p class="unlocked-hint" id="discHint">tap the disc to play our song</p>
      </div>
    </main>

  </section>

 <!-- MUSIC DISC & CONTROLLER -->
    <div class="disc-wrap" id="discWrap">
      <button type="button" class="music-disc" id="musicDiscButton" aria-pressed="false" aria-label="Play our song">
        <span class="disc-grooves" aria-hidden="true">
          <span class="disc-label" aria-hidden="true">♪</span>
          <span class="disc-hole" aria-hidden="true"></span>
        </span>
      </button>
      <p class="unlocked-hint" id="discHint">tap the disc to pause</p>

      <!-- AUDIO CONTROLLER -->
      <div class="audio-controls" id="audioControls">
        <div class="time-display">
          <span id="currentTime">0:00</span> / <span id="durationTime">0:00</span>
        </div>
        <input type="range" id="seekBar" class="seek-bar" value="0" min="0" step="0.1" aria-label="Song progress">
        <button type="button" id="loopBtn" class="control-btn is-active" aria-label="Toggle Loop" title="Loop Song">
          🔁
        </button>
      </div>
    </div>
  </main>

</section>

<!-- AUDIO ELEMENT -->
<audio id="bgMusic" src="File Holder/Rex Orange County - AMAZING (Lyrics).mp3" loop preload="auto" autoplay></audio>

  <script src="background.js"></script>
  <script src="flowers.js"></script>
  <script src="header.js"></script>
  <script src="main.js"></script>
</body>
</html>
