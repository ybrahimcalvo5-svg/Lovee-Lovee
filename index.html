<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For my Love Love Angel Ann Obciana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- slow-moving glow backdrop, drawn continuously in script.js -->
<canvas id="bgCanvas" aria-hidden="true"></canvas>

<!-- floating hearts live here, shared across both screens -->
<div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

<!-- ================= INTRO SCREEN ================= -->
<section class="screen intro-screen" id="introScreen">
  <div class="intro-content">
    <p class="intro-brand">
      <span class="intro-brand-line intro-brand-line--small">For my Love Love</span>
      <span class="intro-brand-line intro-brand-line--big">Angel Ann Obciana</span>
    </p>

    <button class="flower-button" id="flowerButton" aria-label="Click the flower to open">
      <svg class="flower-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <g class="flower-petals">
          <ellipse class="petal" cx="100" cy="58" rx="22" ry="40"/>
          <ellipse class="petal" cx="100" cy="58" rx="22" ry="40" transform="rotate(60 100 100)"/>
          <ellipse class="petal" cx="100" cy="58" rx="22" ry="40" transform="rotate(120 100 100)"/>
          <ellipse class="petal" cx="100" cy="58" rx="22" ry="40" transform="rotate(180 100 100)"/>
          <ellipse class="petal" cx="100" cy="58" rx="22" ry="40" transform="rotate(240 100 100)"/>
          <ellipse class="petal" cx="100" cy="58" rx="22" ry="40" transform="rotate(300 100 100)"/>
        </g>
        <circle class="flower-center" cx="100" cy="100" r="20"/>
      </svg>
    </button>

    <p class="intro-hint">tap the flower</p>
  </div>
</section>

<!-- ================= MAIN SCREEN ================= -->
<section class="screen main-screen" id="mainScreen">

  <nav class="site-nav" id="siteHeader" aria-label="Message buttons">
    <!-- filled in by header.js at load time — edit NAV_ITEMS in header.js
         to add/remove/rename buttons, not this markup -->
  </nav>

  <div class="frame">

    <!-- corner ornaments -->
    <span class="corner corner-tl"></span>
    <span class="corner corner-tr"></span>
    <span class="corner corner-bl"></span>
    <span class="corner corner-br"></span>

    <main class="stage" id="stage">
      <p class="stage-idle" id="stageIdle">press the three buttons, in order, whenever you feel like it</p>
      <div class="stage-message" id="stageMessage" aria-live="polite"></div>
    </main>

  </div>
</section>

<script src="header.js"></script>
<script src="script.js"></script>
</body>
</html>
